<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINUX DO 中转站福利领取管理台</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    .dark .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- 顶部导航栏 -->
  <header class="sticky top-0 z-40 glass border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-emerald-500/20 font-bold text-xl">
          🎁
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight flex items-center gap-2">
            中转站福利管理台
            <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-800">LINUX DO 专属</span>
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">实时追踪·一键代回帖·额度到账管理</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openNewModal()" class="flex items-center gap-1.5 px-3.5 py-1.5 text-sm font-medium rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>记一笔新福利</span>
        </button>
        <button onclick="toggleDarkMode()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
          <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">

    <!-- KPI 统计卡片区 -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
      <div class="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 flex items-center justify-center">
          <i data-lucide="layers" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="text-xs text-slate-500 dark:text-slate-400 font-medium">总线报追踪</div>
          <div id="stat-total" class="text-2xl font-bold">0</div>
        </div>
      </div>

      <div class="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex items-center gap-4 cursor-pointer hover:border-red-400 transition" onclick="setTab('PENDING')">
        <div class="w-12 h-12 rounded-xl bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400 flex items-center justify-center">
          <i data-lucide="clock" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="text-xs text-rose-600 dark:text-rose-400 font-medium">🔴 待领取 (未留UID)</div>
          <div id="stat-pending" class="text-2xl font-bold text-rose-600 dark:text-rose-400">0</div>
        </div>
      </div>

      <div class="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex items-center gap-4 cursor-pointer hover:border-amber-400 transition" onclick="setTab('SUBMITTED')">
        <div class="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 flex items-center justify-center">
          <i data-lucide="hourglass" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="text-xs text-amber-600 dark:text-amber-400 font-medium">🟡 待到账 (审核中)</div>
          <div id="stat-submitted" class="text-2xl font-bold text-amber-600 dark:text-amber-400">0</div>
        </div>
      </div>

      <div class="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex items-center gap-4 cursor-pointer hover:border-emerald-400 transition" onclick="setTab('CLAIMED')">
        <div class="w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
          <i data-lucide="check-circle-2" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="text-xs text-emerald-600 dark:text-emerald-400 font-medium">🟢 已到账 (可使用)</div>
          <div id="stat-claimed" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400">0</div>
        </div>
      </div>
    </div>

    <!-- 筛选工具栏 -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-white dark:bg-slate-800 p-3 rounded-2xl border border-slate-200/80 dark:border-slate-700/80">
      <!-- Tabs 按钮组 -->
      <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-900/60 p-1 rounded-xl text-sm font-medium">
        <button onclick="setTab('ALL')" id="tab-ALL" class="tab-btn px-3 py-1.5 rounded-lg transition">全部</button>
        <button onclick="setTab('PENDING')" id="tab-PENDING" class="tab-btn px-3 py-1.5 rounded-lg transition">🔴 待领取</button>
        <button onclick="setTab('SUBMITTED')" id="tab-SUBMITTED" class="tab-btn px-3 py-1.5 rounded-lg transition">🟡 待到账</button>
        <button onclick="setTab('CLAIMED')" id="tab-CLAIMED" class="tab-btn px-3 py-1.5 rounded-lg transition">🟢 已到账</button>
      </div>

      <!-- 搜索框 -->
      <div class="relative flex-1 sm:max-w-xs">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="renderCards()" placeholder="搜索站点名称/倍率/关键词..." class="w-full pl-9 pr-4 py-1.5 text-sm rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
    </div>

    <!-- 列表展示区 -->
    <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- 动态渲染卡片 -->
    </div>

    <!-- 空状态提示 -->
    <div id="emptyState" class="hidden py-16 text-center text-slate-400">
      <i data-lucide="inbox" class="w-12 h-12 mx-auto stroke-1 mb-2"></i>
      <p>当前分类下暂无福利记录</p>
    </div>

  </main>

  <!-- 填写 UID / 回帖 Modal 弹窗 -->
  <div id="claimModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
      <div class="flex items-center justify-between border-b pb-3 border-slate-100 dark:border-slate-700">
        <h3 class="font-bold text-lg flex items-center gap-2">
          <span>✍️ 填写 UID / 登记回帖</span>
        </h3>
        <button onclick="closeClaimModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">中转站名称</label>
          <div id="modalSiteName" class="text-sm font-semibold"></div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">你的账号 UID</label>
          <input type="text" id="modalUidInput" placeholder="输入你在该中转站注册的 UID (如 12345)" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-900 focus:ring-2 focus:ring-emerald-500 outline-none">
          <p class="text-xs text-slate-400 mt-1">在中转站个人中心可以找到。填入后将自动生成回复并变更状态为待到账。</p>
        </div>

        <div class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl text-xs space-y-1 text-slate-600 dark:text-slate-400 border border-slate-200/60 dark:border-slate-800">
          <div class="font-medium text-slate-700 dark:text-slate-300">💡 推荐操作步骤：</div>
          <div>1. 点下方按钮直达中转站注册并复制 UID；</div>
          <div>2. 填入上方输入框，点击“确认提交”；</div>
          <div>3. 状态将自动更新为 🟡 待到账。</div>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button onclick="closeClaimModal()" class="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">取消</button>
        <button onclick="submitClaim()" class="px-4 py-2 text-sm font-medium bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow-sm">确认并标记为待到账</button>
      </div>
    </div>
  </div>

  <!-- 手动新增福利 Modal 弹窗 -->
  <div id="newModal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
      <div class="flex items-center justify-between border-b pb-3 border-slate-100 dark:border-slate-700">
        <h3 class="font-bold text-lg">➕ 记录新发现的中转站福利</h3>
        <button onclick="closeNewModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">站点名称 *</label>
          <input type="text" id="newSiteName" placeholder="例如：AllRouter" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-900 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">福利说明 *</label>
          <input type="text" id="newReward" placeholder="例如：留 UID 送 5 美元额度" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-900 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">中转站网址</label>
          <input type="url" id="newSiteUrl" placeholder="https://..." class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-900 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">L 站原帖链接</label>
          <input type="url" id="newTopicUrl" placeholder="https://linux.do/t/topic/..." class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-900 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">倍率/亮点备注</label>
          <input type="text" id="newNotes" placeholder="例如：Claude 0.25x / GPT 0.053x" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-900 outline-none">
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button onclick="closeNewModal()" class="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">取消</button>
        <button onclick="saveNewRecord()" class="px-4 py-2 text-sm font-medium bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow-sm">保存线报</button>
      </div>
    </div>
  </div>

  <script>
    // 默认内置初始数据（与 rewards_data.json 对齐）
    const DEFAULT_DATA = [
      {
        "topic_id": "3194780",
        "site_name": "AllRouter",
        "site_url": "https://allrouter.com",
        "reward_desc": "留 UID 送 5 美元额度",
        "status": "PENDING",
        "my_uid": "",
        "topic_url": "https://linux.do/t/topic/3194780",
        "created_at": "2026-11-22 15:59:22",
        "updated_at": "2026-11-22 15:59:22",
        "notes": "主打不降智，Claude max 0.25x / GPT 0.053x"
      }
    ];

    let currentTab = 'ALL';
    let rewards = [];
    let activeClaimTopicId = null;

    // 初始化数据
    async function initData() {
      // 优先从本地/远程 rewards_data.json 加载
      try {
        const resp = await fetch('rewards_data.json');
        if (resp.ok) {
          rewards = await resp.json();
        } else {
          loadFromLocal();
        }
      } catch (e) {
        loadFromLocal();
      }
      renderAll();
    }

    function loadFromLocal() {
      const stored = localStorage.getItem('linuxdo_rewards_data');
      if (stored) {
        try { rewards = JSON.parse(stored); } catch(e) { rewards = DEFAULT_DATA; }
      } else {
        rewards = DEFAULT_DATA;
      }
    }

    function persist() {
      localStorage.setItem('linuxdo_rewards_data', JSON.stringify(rewards));
      // 如果本地有后台接口，也可以异步同步给 server
      try {
        fetch('/api/rewards/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(rewards)
        }).catch(() => {});
      } catch(e){}
      renderAll();
    }

    function renderAll() {
      updateStats();
      updateTabButtons();
      renderCards();
      lucide.createIcons();
    }

    function updateStats() {
      document.getElementById('stat-total').innerText = rewards.length;
      document.getElementById('stat-pending').innerText = rewards.filter(x => x.status === 'PENDING').length;
      document.getElementById('stat-submitted').innerText = rewards.filter(x => x.status === 'SUBMITTED').length;
      document.getElementById('stat-claimed').innerText = rewards.filter(x => x.status === 'CLAIMED').length;
    }

    function setTab(tab) {
      currentTab = tab;
      updateTabButtons();
      renderCards();
    }

    function updateTabButtons() {
      const tabs = ['ALL', 'PENDING', 'SUBMITTED', 'CLAIMED'];
      tabs.forEach(t => {
        const btn = document.getElementById('tab-' + t);
        if (currentTab === t) {
          btn.className = 'tab-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm font-semibold';
        } else {
          btn.className = 'tab-btn px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
        }
      });
    }

    function renderCards() {
      const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const container = document.getElementById('cardsContainer');
      const emptyState = document.getElementById('emptyState');

      let list = rewards;
      if (currentTab !== 'ALL') {
        list = list.filter(x => x.status === currentTab);
      }
      if (query) {
        list = list.filter(x => 
          (x.site_name || '').toLowerCase().includes(query) ||
          (x.reward_desc || '').toLowerCase().includes(query) ||
          (x.notes || '').toLowerCase().includes(query)
        );
      }

      if (list.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      container.innerHTML = list.map(item => {
        const isPending = item.status === 'PENDING';
        const isSubmitted = item.status === 'SUBMITTED';
        const isClaimed = item.status === 'CLAIMED';

        let badge = '';
        if (isPending) badge = `<span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-rose-100 text-rose-700 dark:bg-rose-950/80 dark:text-rose-400 border border-rose-200 dark:border-rose-800 flex items-center gap-1"><i data-lucide="alert-circle" class="w-3 h-3"></i> 待领取 (未留UID)</span>`;
        if (isSubmitted) badge = `<span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-amber-100 text-amber-700 dark:bg-amber-950/80 dark:text-amber-400 border border-amber-200 dark:border-amber-800 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> 待到账 (审核中)</span>`;
        if (isClaimed) badge = `<span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950/80 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800 flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> 已到账可用</span>`;

        return `
          <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-4">
            <div>
              <div class="flex items-start justify-between gap-3 mb-2">
                <div>
                  <h3 class="font-bold text-lg tracking-tight hover:text-emerald-600 transition flex items-center gap-1.5">
                    ${item.site_name}
                  </h3>
                  <div class="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
                    <span>Topic ID: ${item.topic_id}</span>
                    <span>•</span>
                    <span>${item.created_at || ''}</span>
                  </div>
                </div>
                ${badge}
              </div>

              <!-- 福利高亮 -->
              <div class="p-3 bg-slate-50 dark:bg-slate-900/60 rounded-xl my-3 border border-slate-100 dark:border-slate-800/80">
                <div class="text-xs text-slate-500 dark:text-slate-400">福利内容</div>
                <div class="font-semibold text-sm text-emerald-600 dark:text-emerald-400">${item.reward_desc}</div>
                ${item.notes ? `<div class="text-xs text-slate-500 mt-1">亮点：${item.notes}</div>` : ''}
              </div>

              <!-- 我的 UID 信息 -->
              ${item.my_uid ? `
                <div class="text-xs flex items-center gap-2 text-slate-600 dark:text-slate-300 mb-2">
                  <span class="font-medium text-slate-400">已留 UID:</span>
                  <code class="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-900 font-mono font-bold text-slate-800 dark:text-slate-200">${item.my_uid}</code>
                  ${item.submitted_at ? `<span class="text-slate-400">(${item.submitted_at})</span>` : ''}
                </div>
              ` : ''}
            </div>

            <!-- 操作按钮栏 -->
            <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-slate-100 dark:border-slate-700/60">
              <div class="flex items-center gap-2">
                ${item.site_url ? `
                  <a href="${item.site_url}" target="_blank" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition flex items-center gap-1">
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i> 直达注册
                  </a>
                ` : ''}
                ${item.topic_url ? `
                  <a href="${item.topic_url}" target="_blank" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition flex items-center gap-1">
                    <i data-lucide="message-square" class="w-3.5 h-3.5"></i> 原帖
                  </a>
                ` : ''}
              </div>

              <div class="flex items-center gap-1.5">
                ${isPending ? `
                  <button onclick="openClaimModal('${item.topic_id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-600 hover:bg-rose-500 text-white shadow-sm transition flex items-center gap-1">
                    <i data-lucide="pen-tool" class="w-3.5 h-3.5"></i> 填UID/回帖
                  </button>
                ` : ''}
                ${isSubmitted ? `
                  <button onclick="markDone('${item.topic_id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition flex items-center gap-1">
                    <i data-lucide="check" class="w-3.5 h-3.5"></i> 标记已到账
                  </button>
                ` : ''}
                ${isClaimed ? `
                  <button onclick="reopen('${item.topic_id}')" class="px-2.5 py-1.5 rounded-lg text-xs text-slate-400 hover:text-slate-600 transition">
                    重新标记
                  </button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    // Modal 控制
    function openClaimModal(topicId) {
      activeClaimTopicId = topicId;
      const item = rewards.find(x => x.topic_id === topicId);
      if (!item) return;
      document.getElementById('modalSiteName').innerText = `${item.site_name} (${item.reward_desc})`;
      document.getElementById('modalUidInput').value = item.my_uid || '';
      document.getElementById('claimModal').classList.remove('hidden');
    }

    function closeClaimModal() {
      document.getElementById('claimModal').classList.add('hidden');
      activeClaimTopicId = null;
    }

    function submitClaim() {
      const uid = document.getElementById('modalUidInput').value.trim();
      if (!uid) {
        alert('请先输入你的账号 UID！');
        return;
      }
      const item = rewards.find(x => x.topic_id === activeClaimTopicId);
      if (item) {
        item.status = 'SUBMITTED';
        item.my_uid = uid;
        item.submitted_at = new Date().toLocaleString();
        persist();
      }
      closeClaimModal();
    }

    function markDone(topicId) {
      const item = rewards.find(x => x.topic_id === topicId);
      if (item) {
        item.status = 'CLAIMED';
        item.claimed_at = new Date().toLocaleString();
        persist();
      }
    }

    function reopen(topicId) {
      const item = rewards.find(x => x.topic_id === topicId);
      if (item) {
        item.status = 'PENDING';
        persist();
      }
    }

    // 新增福利
    function openNewModal() {
      document.getElementById('newModal').classList.remove('hidden');
    }

    function closeNewModal() {
      document.getElementById('newModal').classList.add('hidden');
    }

    function saveNewRecord() {
      const name = document.getElementById('newSiteName').value.trim();
      const reward = document.getElementById('newReward').value.trim();
      const siteUrl = document.getElementById('newSiteUrl').value.trim();
      const topicUrl = document.getElementById('newTopicUrl').value.trim();
      const notes = document.getElementById('newNotes').value.trim();

      if (!name || !reward) {
        alert('站点名称和福利说明为必填项！');
        return;
      }

      let topicId = Date.now().toString();
      const match = topicUrl.match(/topic\/(\d+)/);
      if (match) topicId = match[1];

      rewards.unshift({
        topic_id: topicId,
        site_name: name,
        site_url: siteUrl,
        reward_desc: reward,
        status: 'PENDING',
        my_uid: '',
        topic_url: topicUrl,
        created_at: new Date().toLocaleString(),
        notes: notes
      });

      persist();
      closeNewModal();
    }

    // 暗黑模式切换
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    window.addEventListener('DOMContentLoaded', initData);
  </script>
</body>
</html>

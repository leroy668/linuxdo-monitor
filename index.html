<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中转站资产大清仓与健康看板</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px); }
    .dark .glass { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdf4', 500: '#10b981', 600: '#059669' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- 顶部导航栏 -->
  <header class="sticky top-0 z-40 glass border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-emerald-500/20 font-bold text-xl">
          ⚡
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight flex items-center gap-2">
            中转站资产管理看板
            <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950/80 dark:text-emerald-400 font-semibold">真实链接已核验</span>
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">分清主力·盘活残额·排查死站·一键回帖</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openNewModal()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>记一笔新站点</span>
        </button>
        <button onclick="reloadCleanData()" class="flex items-center gap-1 px-2.5 py-1.5 text-xs font-medium rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition border border-slate-200 dark:border-slate-700" title="重新从 rewards_data.json 加载纯净数据">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
          <span>重载数据</span>
        </button>
        <button onclick="exportJSON()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="导出数据备份">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
        <button onclick="toggleDarkMode()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- 4 维核心状态 KPI 统计卡片区 -->
    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
      <!-- 1. 全部 -->
      <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm cursor-pointer hover:border-slate-400 transition" onclick="setTab('ALL')">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">总收录资产</span>
          <i data-lucide="layers" class="w-4 h-4 text-slate-400"></i>
        </div>
        <div id="stat-total" class="text-2xl font-bold">0</div>
      </div>

      <!-- 2. 主力在用 -->
      <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm cursor-pointer hover:border-emerald-500 transition" onclick="setTab('ACTIVE')">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs text-emerald-600 dark:text-emerald-400 font-semibold">🟢 主力在用</span>
          <i data-lucide="zap" class="w-4 h-4 text-emerald-500"></i>
        </div>
        <div id="stat-active" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400">0</div>
      </div>

      <!-- 3. 备用有钱 -->
      <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm cursor-pointer hover:border-amber-500 transition" onclick="setTab('STANDBY')">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs text-amber-600 dark:text-amber-400 font-semibold">🟡 备用有钱</span>
          <i data-lucide="wallet" class="w-4 h-4 text-amber-500"></i>
        </div>
        <div id="stat-standby" class="text-2xl font-bold text-amber-600 dark:text-amber-400">0</div>
      </div>

      <!-- 4. 待领福利 -->
      <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm cursor-pointer hover:border-rose-500 transition" onclick="setTab('PENDING')">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs text-rose-600 dark:text-rose-400 font-semibold">🔴 待领羊毛</span>
          <i data-lucide="gift" class="w-4 h-4 text-rose-500"></i>
        </div>
        <div id="stat-pending" class="text-2xl font-bold text-rose-600 dark:text-rose-400">0</div>
      </div>

      <!-- 5. 难用废弃 -->
      <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm cursor-pointer hover:border-slate-500 transition" onclick="setTab('ARCHIVED')">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs text-slate-400 font-semibold">⚫ 难用/废弃</span>
          <i data-lucide="trash-2" class="w-4 h-4 text-slate-400"></i>
        </div>
        <div id="stat-archived" class="text-2xl font-bold text-slate-400">0</div>
      </div>
    </div>

    <!-- 过滤器与控制栏 -->
    <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4 bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm">
      
      <!-- 状态 Tabs -->
      <div class="flex flex-wrap items-center gap-1 bg-slate-100 dark:bg-slate-800/80 p-1 rounded-xl text-xs font-semibold">
        <button onclick="setTab('ALL')" id="tab-ALL" class="tab-btn px-3 py-1.5 rounded-lg transition">全部</button>
        <button onclick="setTab('ACTIVE')" id="tab-ACTIVE" class="tab-btn px-3 py-1.5 rounded-lg transition">🟢 主力</button>
        <button onclick="setTab('STANDBY')" id="tab-STANDBY" class="tab-btn px-3 py-1.5 rounded-lg transition">🟡 备用</button>
        <button onclick="setTab('PENDING')" id="tab-PENDING" class="tab-btn px-3 py-1.5 rounded-lg transition">🔴 待领</button>
        <button onclick="setTab('ARCHIVED')" id="tab-ARCHIVED" class="tab-btn px-3 py-1.5 rounded-lg transition">⚫ 废弃</button>
      </div>

      <!-- 类型分类 + 搜索 + 隐藏开关 -->
      <div class="flex flex-wrap sm:flex-nowrap items-center gap-2">
        <!-- 类型筛选 -->
        <select id="typeFilter" onchange="renderCards()" class="px-2.5 py-1.5 text-xs rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 outline-none">
          <option value="ALL">全部分类 (控制台+活动)</option>
          <option value="CONSOLE">🖥️ 中转控制台</option>
          <option value="DEAL">🎁 L站活动帖</option>
        </select>

        <!-- 隐藏废弃站开关 -->
        <label class="flex items-center gap-1.5 text-xs text-slate-500 cursor-pointer select-none px-2 py-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800">
          <input type="checkbox" id="hideArchived" onchange="renderCards()" checked class="rounded text-emerald-600 focus:ring-0">
          <span>隐藏已废弃</span>
        </label>

        <!-- 搜索框 -->
        <div class="relative flex-1 sm:w-64">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="searchInput" oninput="renderCards()" placeholder="搜索站点/网址/备注..." class="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
      </div>

    </div>

    <!-- 列表展示区 -->
    <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- 动态渲染卡片 -->
    </div>

    <!-- 空状态 -->
    <div id="emptyState" class="hidden py-16 text-center text-slate-400">
      <i data-lucide="inbox" class="w-10 h-10 mx-auto stroke-1 mb-2"></i>
      <p class="text-sm">当前筛选条件下暂无站点</p>
    </div>

  </main>

  <!-- 填写 UID / 回帖登记 Modal 弹窗 -->
  <div id="claimModal" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
      <div class="flex items-center justify-between border-b pb-3 border-slate-100 dark:border-slate-800">
        <h3 class="font-bold text-base flex items-center gap-2">
          <span>✍️ 登记 UID & 补充控制台</span>
        </h3>
        <button onclick="closeClaimModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">目标中转站</label>
          <div id="modalSiteName" class="text-sm font-bold text-slate-800 dark:text-slate-100"></div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">你的账号 UID</label>
          <input type="text" id="modalUidInput" placeholder="输入你在该站注册的 UID (如 12345)" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">实际控制台/官网网址 (可选)</label>
          <input type="url" id="modalSiteUrlInput" placeholder="https://... (填入后将生成直接跳转按钮)" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">备注说明 (可选)</label>
          <input type="text" id="modalNotesInput" placeholder="例如：Claude 0.25x / 送 5 刀" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button onclick="closeClaimModal()" class="px-3.5 py-1.5 text-xs text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">取消</button>
        <button onclick="submitClaim()" class="px-3.5 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow-sm">保存并标记为备用</button>
      </div>
    </div>
  </div>

  <!-- 编辑完整信息 Modal 弹窗 -->
  <div id="editModal" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
      <div class="flex items-center justify-between border-b pb-3 border-slate-100 dark:border-slate-800">
        <h3 class="font-bold text-base">✏️ 编辑站点信息</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-400 mb-1">站点名称 *</label>
          <input type="text" id="editSiteName" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
        </div>
        <div>
          <label class="block font-semibold text-slate-400 mb-1">控制台/官网网址 (留空则不显示控制台按钮)</label>
          <input type="url" id="editSiteUrl" placeholder="https://..." class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
        </div>
        <div>
          <label class="block font-semibold text-slate-400 mb-1">原帖网址 (LINUX DO 话题链接)</label>
          <input type="url" id="editTopicUrl" placeholder="https://linux.do/t/topic/..." class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
        </div>
        <div>
          <label class="block font-semibold text-slate-400 mb-1">状态分类</label>
          <select id="editStatus" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
            <option value="ACTIVE">🟢 主力在用 (有钱/好用)</option>
            <option value="STANDBY">🟡 备用有钱 (有残额/工具)</option>
            <option value="PENDING">🔴 待领羊毛 (福利帖)</option>
            <option value="ARCHIVED">⚫ 难用废弃</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-400 mb-1">我的 UID</label>
          <input type="text" id="editUid" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
        </div>
        <div>
          <label class="block font-semibold text-slate-400 mb-1">备注/残余额度</label>
          <input type="text" id="editNotes" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
        </div>
      </div>

      <div class="flex items-center justify-between pt-2">
        <button onclick="deleteCurrentItem()" class="text-xs text-rose-500 hover:text-rose-700">删除此站点</button>
        <div class="flex items-center gap-2">
          <button onclick="closeEditModal()" class="px-3.5 py-1.5 text-xs text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">取消</button>
          <button onclick="saveEditRecord()" class="px-3.5 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow-sm">保存修改</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增站点 Modal 弹窗 -->
  <div id="newModal" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 space-y-4">
      <div class="flex items-center justify-between border-b pb-3 border-slate-100 dark:border-slate-800">
        <h3 class="font-bold text-base">➕ 手动记一笔新站点</h3>
        <button onclick="closeNewModal()" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-semibold text-slate-400 mb-1">站点名称 *</label>
          <input type="text" id="newSiteName" placeholder="例如：元流 / SevenAI" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
        </div>
        <div>
          <label class="block font-semibold text-slate-400 mb-1">控制台/官网网址 (可选)</label>
          <input type="url" id="newSiteUrl" placeholder="https://..." class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
        </div>
        <div>
          <label class="block font-semibold text-slate-400 mb-1">原帖网址 (可选)</label>
          <input type="url" id="newTopicUrl" placeholder="https://linux.do/t/topic/..." class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
        </div>
        <div>
          <label class="block font-semibold text-slate-400 mb-1">状态分类</label>
          <select id="newStatus" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
            <option value="ACTIVE">🟢 主力在用 (有钱/好用)</option>
            <option value="STANDBY">🟡 备用有钱 (有残额/工具)</option>
            <option value="PENDING">🔴 待领羊毛 (线报)</option>
            <option value="ARCHIVED">⚫ 难用废弃</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-400 mb-1">备注/残余额度 (例如: 还剩5块钱)</label>
          <input type="text" id="newNotes" placeholder="例如：还有 1 块钱 / Claude max 满血" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 dark:bg-slate-950 outline-none">
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button onclick="closeNewModal()" class="px-3.5 py-1.5 text-xs text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">取消</button>
        <button onclick="saveNewRecord()" class="px-3.5 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow-sm">保存入库</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'linuxdo_rewards_data_v3';
    let currentTab = 'ALL';
    let rewards = [];
    let activeTopicId = null;
    let editItemId = null;

    const STATUS_INFO = {
      ACTIVE:   { label: '🟢 主力在用', badge: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/80 dark:text-emerald-400 border-emerald-300 dark:border-emerald-800' },
      STANDBY:  { label: '🟡 备用有钱', badge: 'bg-amber-100 text-amber-700 dark:bg-amber-950/80 dark:text-amber-400 border-amber-300 dark:border-amber-800' },
      PENDING:  { label: '🔴 待领羊毛', badge: 'bg-rose-100 text-rose-700 dark:bg-rose-950/80 dark:text-rose-400 border-rose-300 dark:border-rose-800' },
      ARCHIVED: { label: '⚫ 难用废弃', badge: 'bg-slate-200 text-slate-600 dark:bg-slate-800 dark:text-slate-400 border-slate-300 dark:border-slate-700' }
    };

    async function initData() {
      // 检查本地缓存
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          rewards = JSON.parse(stored);
        } catch(e) {
          rewards = [];
        }
      }
      
      // 若无缓存或缓存空，从 rewards_data.json 加载
      if (!rewards || rewards.length === 0) {
        await reloadCleanData();
      } else {
        renderAll();
      }
    }

    async function reloadCleanData() {
      try {
        const resp = await fetch('rewards_data.json?t=' + Date.now());
        if (resp.ok) {
          rewards = await resp.json();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(rewards));
        }
      } catch (e) {
        console.error('加载纯净数据失败', e);
      }
      renderAll();
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rewards));
      renderAll();
    }

    function renderAll() {
      updateStats();
      updateTabButtons();
      renderCards();
      lucide.createIcons();
    }

    function updateStats() {
      document.getElementById('stat-total').innerText = rewards.length;
      document.getElementById('stat-active').innerText = rewards.filter(x => x.status === 'ACTIVE').length;
      document.getElementById('stat-standby').innerText = rewards.filter(x => x.status === 'STANDBY').length;
      document.getElementById('stat-pending').innerText = rewards.filter(x => x.status === 'PENDING').length;
      document.getElementById('stat-archived').innerText = rewards.filter(x => x.status === 'ARCHIVED').length;
    }

    function setTab(tab) {
      currentTab = tab;
      updateTabButtons();
      renderCards();
    }

    function updateTabButtons() {
      const tabs = ['ALL', 'ACTIVE', 'STANDBY', 'PENDING', 'ARCHIVED'];
      tabs.forEach(t => {
        const btn = document.getElementById('tab-' + t);
        if (currentTab === t) {
          btn.className = 'tab-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-900 text-emerald-600 dark:text-emerald-400 shadow-sm font-bold';
        } else {
          btn.className = 'tab-btn px-3 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200';
        }
      });
    }

    function getDomain(url) {
      if (!url) return '';
      try {
        const u = new URL(url);
        return u.hostname;
      } catch(e) {
        return url.replace('https://', '').replace('http://', '').split('/')[0];
      }
    }

    function renderCards() {
      const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      const typeFilter = document.getElementById('typeFilter').value;
      const hideArchived = document.getElementById('hideArchived').checked;

      const container = document.getElementById('cardsContainer');
      const emptyState = document.getElementById('emptyState');

      let list = rewards;

      // 状态筛选
      if (currentTab !== 'ALL') {
        list = list.filter(x => x.status === currentTab);
      } else if (hideArchived) {
        list = list.filter(x => x.status !== 'ARCHIVED');
      }

      // 类型筛选
      if (typeFilter !== 'ALL') {
        list = list.filter(x => (x.item_type || 'CONSOLE') === typeFilter);
      }

      // 关键词搜索
      if (query) {
        list = list.filter(x => 
          (x.site_name || '').toLowerCase().includes(query) ||
          (x.full_name || '').toLowerCase().includes(query) ||
          (x.site_url || '').toLowerCase().includes(query) ||
          (x.notes || '').toLowerCase().includes(query) ||
          (x.reward_desc || '').toLowerCase().includes(query)
        );
      }

      if (list.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      container.innerHTML = list.map(item => {
        const st = STATUS_INFO[item.status] || STATUS_INFO.STANDBY;
        const isConsole = (item.item_type || 'CONSOLE') === 'CONSOLE';
        const hasSite = Boolean(item.site_url && item.site_url.trim());
        const hasTopic = Boolean(item.topic_url && item.topic_url.trim());

        // 计算展示副标题
        let subtitleText = '';
        let subtitleLink = '#';
        if (hasSite) {
          subtitleText = '🌐 ' + getDomain(item.site_url);
          subtitleLink = item.site_url;
        } else if (hasTopic) {
          subtitleText = '💬 LINUX DO 福利原帖';
          subtitleLink = item.topic_url;
        } else {
          subtitleText = '📝 自定义记录';
        }

        return `
          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-3">
            <div>
              <div class="flex items-start justify-between gap-2 mb-1.5">
                <div class="min-w-0">
                  <h3 class="font-bold text-sm truncate hover:text-emerald-500 transition" title="${item.full_name || item.site_name}">
                    ${hasSite ? '🖥️ ' : '🎁 '}${item.site_name}
                  </h3>
                  <a href="${subtitleLink}" target="_blank" class="text-[11px] text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 truncate mt-0.5 block" title="${subtitleLink}">
                    ${subtitleText}
                  </a>
                </div>

                <!-- 状态选择下拉框 -->
                <select onchange="changeStatus('${item.id || item.topic_id}', this.value)" class="text-[11px] font-semibold px-2 py-0.5 rounded-full border outline-none cursor-pointer ${st.badge}">
                  <option value="ACTIVE" ${item.status === 'ACTIVE' ? 'selected' : ''}>🟢 主力</option>
                  <option value="STANDBY" ${item.status === 'STANDBY' ? 'selected' : ''}>🟡 备用</option>
                  <option value="PENDING" ${item.status === 'PENDING' ? 'selected' : ''}>🔴 待领</option>
                  <option value="ARCHIVED" ${item.status === 'ARCHIVED' ? 'selected' : ''}>⚫ 废弃</option>
                </select>
              </div>

              <!-- 备注与福利说明 -->
              <div class="p-2.5 bg-slate-50 dark:bg-slate-950 rounded-xl my-2 border border-slate-100 dark:border-slate-800 text-xs space-y-1">
                ${item.reward_desc ? `<div class="font-medium text-emerald-600 dark:text-emerald-400 truncate">🎁 ${item.reward_desc}</div>` : ''}
                ${item.notes ? `<div class="text-slate-400 text-[11px] truncate">📌 备注：${item.notes}</div>` : ''}
                ${item.my_uid ? `<div class="text-[11px] text-indigo-600 dark:text-indigo-400 font-mono">🔑 UID: ${item.my_uid}</div>` : ''}
              </div>
            </div>

            <!-- 操作按钮 -->
            <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-100 dark:border-slate-800 text-xs">
              <div class="flex items-center gap-1.5 flex-wrap">
                <!-- 控制台按钮：只有当有真实 site_url 时才展示 -->
                ${hasSite ? `
                  <a href="${item.site_url}" target="_blank" class="px-2.5 py-1 rounded-lg font-medium bg-slate-900 text-white dark:bg-emerald-600 dark:hover:bg-emerald-500 hover:bg-slate-800 transition flex items-center gap-1">
                    <i data-lucide="external-link" class="w-3 h-3"></i> 进入控制台
                  </a>
                ` : ''}

                <!-- 原帖按钮：若无控制台，则作为主入口突出展示 -->
                ${hasTopic ? `
                  <a href="${item.topic_url}" target="_blank" class="px-2.5 py-1 rounded-lg font-medium ${!hasSite ? 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 hover:bg-indigo-100' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800'} transition flex items-center gap-1">
                    <i data-lucide="message-square" class="w-3 h-3"></i> ${!hasSite ? '查看原帖找官网' : '原帖'}
                  </a>
                ` : ''}
              </div>

              <div class="flex items-center gap-1">
                ${(!hasSite || item.status === 'PENDING') ? `
                  <button onclick="openClaim('${item.id || item.topic_id}')" class="px-2 py-1 rounded-lg font-medium bg-rose-50 text-rose-600 dark:bg-rose-950/60 dark:text-rose-400 border border-rose-200 dark:border-rose-900 hover:bg-rose-100 transition flex items-center gap-1" title="登记UID并补充官网网址">
                    <i data-lucide="pen-tool" class="w-3 h-3"></i> 记UID
                  </button>
                ` : ''}
                <button onclick="openEditModal('${item.id || item.topic_id}')" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="完整修改信息">
                  <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function changeStatus(id, newStatus) {
      const item = rewards.find(x => (x.id || x.topic_id) === id);
      if (item) {
        item.status = newStatus;
        persist();
      }
    }

    function openClaim(id) {
      activeTopicId = id;
      const item = rewards.find(x => (x.id || x.topic_id) === id);
      if (!item) return;
      document.getElementById('modalSiteName').innerText = `${item.site_name} ${item.reward_desc ? ' · ' + item.reward_desc : ''}`;
      document.getElementById('modalUidInput').value = item.my_uid || '';
      document.getElementById('modalSiteUrlInput').value = item.site_url || '';
      document.getElementById('modalNotesInput').value = item.notes || '';
      document.getElementById('claimModal').classList.remove('hidden');
    }

    function closeClaimModal() {
      document.getElementById('claimModal').classList.add('hidden');
      activeTopicId = null;
    }

    function submitClaim() {
      const uid = document.getElementById('modalUidInput').value.trim();
      const siteUrl = document.getElementById('modalSiteUrlInput').value.trim();
      const notes = document.getElementById('modalNotesInput').value.trim();
      const item = rewards.find(x => (x.id || x.topic_id) === activeTopicId);
      if (item) {
        item.my_uid = uid;
        if (siteUrl) {
          item.site_url = siteUrl;
          item.item_type = 'CONSOLE';
        }
        if (notes) item.notes = notes;
        item.status = 'STANDBY';
        persist();
      }
      closeClaimModal();
    }

    function openEditModal(id) {
      editItemId = id;
      const item = rewards.find(x => (x.id || x.topic_id) === id);
      if (!item) return;
      document.getElementById('editSiteName').value = item.site_name || '';
      document.getElementById('editSiteUrl').value = item.site_url || '';
      document.getElementById('editTopicUrl').value = item.topic_url || '';
      document.getElementById('editStatus').value = item.status || 'STANDBY';
      document.getElementById('editUid').value = item.my_uid || '';
      document.getElementById('editNotes').value = item.notes || '';
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
      editItemId = null;
    }

    function saveEditRecord() {
      const item = rewards.find(x => (x.id || x.topic_id) === editItemId);
      if (!item) return;
      const name = document.getElementById('editSiteName').value.trim();
      if (!name) { alert('站点名称必填！'); return; }
      item.site_name = name;
      item.site_url = document.getElementById('editSiteUrl').value.trim();
      item.topic_url = document.getElementById('editTopicUrl').value.trim();
      item.status = document.getElementById('editStatus').value;
      item.my_uid = document.getElementById('editUid').value.trim();
      item.notes = document.getElementById('editNotes').value.trim();
      if (item.site_url) item.item_type = 'CONSOLE';
      persist();
      closeEditModal();
    }

    function deleteCurrentItem() {
      if (!confirm('确定要从看板中删除此站点吗？')) return;
      rewards = rewards.filter(x => (x.id || x.topic_id) !== editItemId);
      persist();
      closeEditModal();
    }

    function openNewModal() { document.getElementById('newModal').classList.remove('hidden'); }
    function closeNewModal() { document.getElementById('newModal').classList.add('hidden'); }

    function saveNewRecord() {
      const name = document.getElementById('newSiteName').value.trim();
      const siteUrl = document.getElementById('newSiteUrl').value.trim();
      const topicUrl = document.getElementById('newTopicUrl').value.trim();
      const status = document.getElementById('newStatus').value;
      const notes = document.getElementById('newNotes').value.trim();

      if (!name) { alert('站点名称必填！'); return; }

      rewards.unshift({
        id: String(Date.now()),
        topic_id: '',
        site_name: name,
        full_name: name,
        site_url: siteUrl,
        topic_url: topicUrl,
        item_type: siteUrl ? 'CONSOLE' : 'DEAL',
        status: status,
        my_uid: '',
        reward_desc: '',
        notes: notes,
        updated_at: new Date().toISOString()
      });

      persist();
      closeNewModal();
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(rewards, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `linuxdo_rewards_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    window.addEventListener('DOMContentLoaded', initData);
  </script>
</body>
</html>
